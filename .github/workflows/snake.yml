name: snake

# README 目前不引用 snake.svg —— 贡献量还撑不起那张图，一整片灰点里
# 只有十来个有色格子，空的可视化比没有更糟。所以停掉每日定时，
# 只留手动触发；等提交密度上来了，把 README 里那行 <img> 加回去即可。
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#bb9af7&color_dots=#1a1b26,#24283b,#3d59a1,#5a7fd4,#7aa2f7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
